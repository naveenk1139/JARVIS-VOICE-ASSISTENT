[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "2.0.0"
description = "J.A.R.V.I.S - a modular voice assistant with a browser UI, a desktop console and a pluggable skill registry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Gaurav Singh", email = "gauravsingh9356@gmail.com" },
  { name = "JARVIS contributors" },
]
keywords = ["voice-assistant", "jarvis", "speech-recognition", "automation", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]

# The core is deliberately small: one HTTP library. Everything else is optional.
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
voice = ["pyttsx3>=2.90"]
mic = ["SpeechRecognition>=3.10", "PyAudio>=0.2.14"]
system = ["psutil>=5.9"]
vision = ["opencv-python>=4.8", "numpy>=1.24", "pytesseract>=0.3.10", "Pillow>=10.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyttsx3>=2.90",
  "psutil>=5.9",
]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyttsx3>=2.90",
  "SpeechRecognition>=3.10",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/naveenk1139/JARVIS-VOICE-ASSISTENT"
Source = "https://github.com/naveenk1139/JARVIS-VOICE-ASSISTENT"
Issues = "https://github.com/naveenk1139/JARVIS-VOICE-ASSISTENT/issues"

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.skills", "jarvis.services", "jarvis.brains", "jarvis.voice", "jarvis.security", "jarvis.server"]

[tool.setuptools.package-data]
jarvis = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["ALL"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["jarvis"]
