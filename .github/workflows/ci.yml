name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"

      - name: Lint
        run: ruff check jarvis tests

      - name: Tests (offline, no services required)
        run: pytest --cov=jarvis --cov-report=term-missing

      - name: CLI smoke test
        run: |
          python -m jarvis version
          python -m jarvis skills
          python -m jarvis ask "calculate 6 times 7"
          python -m jarvis doctor
